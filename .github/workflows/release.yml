name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ steps.rp.outputs.pr != '' && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Pushes made with GITHUB_TOKEN don't trigger CI, so run it explicitly on the release PR branch,
  # then merge the PR once it passes. (workflow_run doesn't fire for token-dispatched runs.)
  ci-and-merge:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.release-please.outputs.pr_branch }}
    steps:
      - name: Run CI on release branch
        run: |
          set -euo pipefail
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          run_id=
          for _ in $(seq 30); do
            sleep 5
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$start\")] | first | .databaseId // empty")
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::CI run not found"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "HEAD_SHA=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" >> "$GITHUB_ENV"
      - name: Merge release PR
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,headRefOid,labels,isCrossRepository,files --jq '.[0] // empty')
          [ -n "$pr" ] || { echo "No open PR for $BRANCH"; exit 0; }

          ok=$(jq -r --arg sha "$HEAD_SHA" '
            .author.login == "app/github-actions"
            and .isCrossRepository == false
            and .headRefOid == $sha
            and ([.labels[].name] | index("autorelease: pending") != null)
            and ([.files[].path] | all(. == "CHANGELOG.md" or . == ".release-please-manifest.json" or . == "app/build.gradle.kts"))
          ' <<<"$pr")
          [ "$ok" = true ] || { echo "::error::PR failed safety checks"; exit 1; }

          number=$(jq -r .number <<<"$pr")
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          # GITHUB_TOKEN merges don't trigger push workflows, so start the release explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
          cache-disabled: true
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk "payphone-tag-${TAG}.apk"
          gh release upload "$TAG" "payphone-tag-${TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
